<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150408">
<title>Dog do Rubão · Fazer pedido</title>
<meta name="description" content="Hot dogs gourmet e sanduíches artesanais. Monte o seu pedido e retire no trailer ou receba em casa.">
<link rel="apple-touch-icon" href="/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#150408;--card:#1f0a0f;--line:#3a1a20;--txt:#f6ecea;--mut:#b09a97;--acc:#e0443e;--ok:#3f9d6a;--warn:#c9962f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 190px}
header{padding:22px 16px 16px;text-align:center;border-bottom:1px solid var(--line)}
header img{width:74px;height:74px;border-radius:50%;object-fit:cover}
h1{font-family:Lora,Georgia,serif;font-size:23px;margin:10px 0 4px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin:15px 0}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
label{display:block;font-size:12.5px;color:var(--mut);margin:14px 0 6px;font-weight:500}
input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#2a0e14;color:var(--txt);font-size:15.5px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5}
.btn.quiet{background:#2a0e14;border:1px solid var(--line);color:var(--txt)}
.cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:24px 0 6px}
.item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.item .info{flex:1;min-width:0}
.nm{font-weight:600;font-size:14.5px}
.ds{color:var(--mut);font-size:12.5px;margin-top:3px}
.pr{color:var(--acc);font-weight:700;margin-top:5px;font-size:14px}
.counter{display:flex;align-items:center;gap:9px;flex-shrink:0}
.counter button{width:33px;height:33px;border-radius:9px;border:1px solid var(--line);background:#2a0e14;color:var(--txt);font-size:18px;cursor:pointer;line-height:1}
.counter b{min-width:17px;text-align:center;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(21,4,8,.97);border-top:1px solid var(--line);padding:13px 16px calc(13px + env(safe-area-inset-bottom));backdrop-filter:blur(9px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .tot{flex:1}.bar .tot b{display:block;font-size:18px}
.bar .tot span{color:var(--mut);font-size:12px}
.bar .btn{width:auto;padding:14px 26px}
.aviso{background:#3a2a10;border:1px solid #6b4d15;color:#f2dfae;border-radius:12px;padding:13px;font-size:13.5px;margin:15px 0}
.fech{background:#3a1418;border:1px solid #6b2027;color:#f5cfd0;border-radius:12px;padding:15px;font-size:14px;margin:15px 0;text-align:center}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer}
.opt.on{border-color:var(--acc);background:#2a0e14}
.opt input{width:19px;height:19px;flex-shrink:0;margin-top:1px;accent-color:var(--acc)}
.opt .t{font-weight:600;font-size:14px}
.opt .s{color:var(--mut);font-size:12.5px;margin-top:2px}
.linha{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.linha.tot{border-top:1px solid var(--line);margin-top:9px;padding-top:11px;font-weight:700;font-size:16.5px}
.mut{color:var(--mut)}
.ok-box{text-align:center;padding:26px 0}
.ok-num{font-family:Lora,serif;font-size:46px;color:var(--acc);font-weight:600}
.pixcode{word-break:break-all;background:#2a0e14;border:1px solid var(--line);border-radius:11px;padding:12px;font-family:ui-monospace,monospace;font-size:11.5px;margin:11px 0}
.hide{display:none!important}
a{color:var(--acc)}
</style>
</head>
<body>

<header>
  <img id="logo" src="/icone-192.png" alt="Dog do Rubão">
  <h1>Dog do Rubão</h1>
  <div class="eyebrow">O simples, levado a sério</div>
</header>

<div class="wrap">
  <div id="carregando" class="card"><div class="mut">Carregando o cardápio…</div></div>
  <div id="fechada" class="fech hide"></div>
  <div id="avisoLoja" class="aviso hide"></div>

  <!-- PASSO 1 -->
  <div id="passoCardapio" class="hide"><div id="cardapio"></div></div>

  <!-- PASSO 2 -->
  <div id="passoDados" class="hide">
    <div class="card">
      <h2>Seus dados</h2>
      <label>Nome completo</label><input id="fNome" autocomplete="name" placeholder="Como podemos te chamar">
      <label>Telefone com DDD</label><input id="fTel" inputmode="numeric" autocomplete="tel" placeholder="61999999999">
    </div>

    <div class="card" id="cardEntrega">
      <h2>Como quer receber</h2>
      <div id="opTipo"></div>
      <div id="boxEndereco" class="hide">
        <label>Endereço completo</label><input id="fEndereco" placeholder="Rua, número, bairro">
        <label>Ponto de referência</label><input id="fRef" placeholder="Ex: portão verde, ao lado da padaria">
      </div>
    </div>

    <div class="card">
      <h2>Pagamento</h2>
      <div id="opPag"></div>
      <div id="boxTroco" class="hide">
        <label>Precisa de troco para quanto?</label>
        <input id="fTroco" type="number" inputmode="decimal" step="0.01" placeholder="Deixe vazio se tiver o valor certo">
      </div>
    </div>

    <div class="card">
      <h2>Observação</h2>
      <textarea id="fObs" rows="3" placeholder="Ex: sem cebola, capricha no cheddar"></textarea>
    </div>

    <div class="card">
      <h2>Resumo</h2>
      <div id="resumo"></div>
    </div>

    <button class="btn" id="btnEnviar">Enviar pedido</button>
    <button class="btn quiet" id="btnVoltar" style="margin-top:10px">Voltar ao cardápio</button>
    <div id="erro" class="fech hide" style="margin-top:14px"></div>
  </div>

  <!-- PASSO 3 -->
  <div id="passoPronto" class="hide">
    <div class="card">
      <div class="ok-box">
        <div class="eyebrow">Pedido recebido</div>
        <div class="ok-num" id="okNum"></div>
        <div id="okTxt" class="mut"></div>
      </div>
      <div id="okPix" class="hide">
        <div class="aviso">Seu pedido só entra na cozinha depois que confirmarmos o Pix. Pague e mande o comprovante no WhatsApp.</div>
        <label>Pix copia e cola</label>
        <div class="pixcode" id="pixCode"></div>
        <button class="btn quiet" onclick="copiarPix()">Copiar código Pix</button>
      </div>
      <a id="okWhats" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:12px">Falar no WhatsApp</a>
      <button class="btn quiet" style="margin-top:10px" onclick="location.href='/pedir.html'">Fazer outro pedido</button>
    </div>
  </div>
</div>

<div class="bar hide" id="barra">
  <div class="in">
    <div class="tot"><b id="barTotal">R$ 0,00</b><span id="barItens">nenhum item</span></div>
    <button class="btn" id="btnContinuar">Continuar</button>
  </div>
</div>

<script>
const URL_="https://svyrayxaprdooqqccjar.supabase.co";
const KEY_="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2eXJheXhhcHJkb29xcWNjamFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMjc3NTAsImV4cCI6MjEwMTkwMzc1MH0.D3SntcSVj7xbTQyJYQjTHwCzDQD41SwLYPmHljPgPk8";
const hdr={'apikey':KEY_,'Authorization':'Bearer '+KEY_,'Content-Type':'application/json'};
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RS=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v)||0;

let LOJA={},PRODUTOS=[],CART={},TIPO='retirada',PAG=null;

async function iniciar(){
  try{
    const [rc,rl]=await Promise.all([
      fetch(URL_+'/rest/v1/cardapio_publico?select=*&order=categoria,ordem,nome',{headers:hdr}),
      fetch(URL_+'/rest/v1/rpc/loja_config',{method:'POST',headers:hdr,body:'{}'})]);
    PRODUTOS=await rc.json();
    LOJA=await rl.json()||{};
  }catch(e){
    el('carregando').innerHTML='<div class="mut">Não consegui carregar o cardápio. Confira sua internet e recarregue a página.</div>';return;}

  el('carregando').classList.add('hide');

  if(LOJA.aviso){el('avisoLoja').textContent=LOJA.aviso;el('avisoLoja').classList.remove('hide');}

  if(!LOJA.aberto){
    el('fechada').innerHTML='<b>Estamos fechados no momento.</b><br>'+
      (LOJA.whatsapp?'Fale com a gente no WhatsApp para saber o horário de hoje.':'Volte mais tarde.')+
      (LOJA.whatsapp?'<br><br><a href="https://wa.me/'+LOJA.whatsapp+'">Abrir o WhatsApp</a>':'');
    el('fechada').classList.remove('hide');return;}

  el('passoCardapio').classList.remove('hide');
  el('barra').classList.remove('hide');
  montarCardapio();
}

function montarCardapio(){
  const cats=[...new Set(PRODUTOS.map(p=>p.categoria||'Cardápio'))];
  el('cardapio').innerHTML=cats.map(c=>
    '<div class="cat">'+esc(c)+'</div>'+
    PRODUTOS.filter(p=>(p.categoria||'Cardápio')===c).map(p=>
      '<div class="item"><div class="info">'+
        '<div class="nm">'+esc(p.nome)+'</div>'+
        (p.descricao?'<div class="ds">'+esc(p.descricao)+'</div>':'')+
        '<div class="pr">'+RS(p.preco)+'</div></div>'+
        '<div class="counter"><button onclick="cnt(\''+p.id+'\',-1)">−</button>'+
        '<b id="q-'+p.id+'">'+(CART[p.id]||0)+'</b>'+
        '<button onclick="cnt(\''+p.id+'\',1)">+</button></div></div>').join('')).join('');
  totalizar();
}

window.cnt=(id,d)=>{
  CART[id]=Math.min(20,Math.max(0,(CART[id]||0)+d));
  if(!CART[id])delete CART[id];
  const q=el('q-'+id);if(q)q.textContent=CART[id]||0;
  totalizar();};

function subtotal(){let s=0;for(const id in CART){const p=PRODUTOS.find(x=>x.id===id);if(p)s+=num(p.preco)*CART[id];}return s;}
function taxa(){return TIPO==='entrega'?num(LOJA.taxa_entrega):0;}
function qtdItens(){let q=0;for(const id in CART)q+=CART[id];return q;}

function totalizar(){
  const q=qtdItens(),s=subtotal();
  el('barTotal').textContent=RS(s+taxa());
  el('barItens').textContent=q?(q===1?'1 item':q+' itens'):'nenhum item';
  el('btnContinuar').disabled=!q;}

el('btnContinuar').onclick=()=>{
  if(!qtdItens())return;
  const min=num(LOJA.pedido_minimo);
  if(min>0&&subtotal()<min){alert('O pedido mínimo é '+RS(min)+'.');return;}
  el('passoCardapio').classList.add('hide');
  el('barra').classList.add('hide');
  el('passoDados').classList.remove('hide');
  montarOpcoes();
  window.scrollTo(0,0);};

el('btnVoltar').onclick=()=>{
  el('passoDados').classList.add('hide');
  el('passoCardapio').classList.remove('hide');
  el('barra').classList.remove('hide');
  window.scrollTo(0,0);};

function opcao(grupo,valor,titulo,sub,marcado){
  return '<label class="opt'+(marcado?' on':'')+'" data-g="'+grupo+'" data-v="'+valor+'">'+
    '<input type="radio" name="'+grupo+'" value="'+valor+'"'+(marcado?' checked':'')+'>'+
    '<span><span class="t">'+titulo+'</span>'+(sub?'<span class="s">'+sub+'</span>':'')+'</span></label>';}

function montarOpcoes(){
  const t=[];
  if(LOJA.retirada_ativa!==false)
    t.push(opcao('tipo','retirada','Retirar no trailer',LOJA.endereco?esc(LOJA.endereco):'Você busca no local',TIPO==='retirada'));
  if(LOJA.entrega_ativa!==false)
    t.push(opcao('tipo','entrega','Receber em casa',num(LOJA.taxa_entrega)?'Taxa de '+RS(LOJA.taxa_entrega):'Taxa a combinar',TIPO==='entrega'));
  el('opTipo').innerHTML=t.join('');

  const p=[];
  if(LOJA.pagar_na_entrega!==false){
    p.push(opcao('pag','cartao_presencial','Cartão na hora','Crédito ou débito na maquininha',false));
    p.push(opcao('pag','pix_presencial','Pix na hora','Você paga na entrega ou na retirada',false));
    p.push(opcao('pag','dinheiro','Dinheiro','Avise se precisa de troco',false));}
  if(LOJA.pix_ativo===true)
    p.push(opcao('pag','pix_antecipado','Pix agora','Pague antes e mande o comprovante. O pedido entra na cozinha depois da confirmação',false));
  if(LOJA.online_ativo===true)
    p.push(opcao('pag','online','Pagar online agora','Cartão pelo site, aprovado na hora',false));
  el('opPag').innerHTML=p.join('');

  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    const g=o.dataset.g;
    document.querySelectorAll('.opt[data-g="'+g+'"]').forEach(x=>x.classList.remove('on'));
    o.classList.add('on');
    o.querySelector('input').checked=true;
    if(g==='tipo'){TIPO=o.dataset.v;el('boxEndereco').classList.toggle('hide',TIPO!=='entrega');}
    else{PAG=o.dataset.v;el('boxTroco').classList.toggle('hide',PAG!=='dinheiro');}
    resumir();});

  el('boxEndereco').classList.toggle('hide',TIPO!=='entrega');
  resumir();}

function resumir(){
  const linhas=Object.keys(CART).map(id=>{
    const p=PRODUTOS.find(x=>x.id===id);
    return '<div class="linha"><span>'+CART[id]+'x '+esc(p.nome)+'</span><span>'+RS(num(p.preco)*CART[id])+'</span></div>';}).join('');
  el('resumo').innerHTML=linhas+
    '<div class="linha"><span class="mut">Subtotal</span><span class="mut">'+RS(subtotal())+'</span></div>'+
    (taxa()?'<div class="linha"><span class="mut">Entrega</span><span class="mut">'+RS(taxa())+'</span></div>':'')+
    '<div class="linha tot"><span>Total</span><span>'+RS(subtotal()+taxa())+'</span></div>'+
    (LOJA.tempo_preparo?'<div class="linha"><span class="mut">Fica pronto em cerca de</span><span class="mut">'+num(LOJA.tempo_preparo)+' min</span></div>':'');}

el('btnEnviar').onclick=async()=>{
  const b=el('btnEnviar'),err=el('erro');
  err.classList.add('hide');
  const nome=el('fNome').value.trim(),tel=el('fTel').value.replace(/\D/g,'');
  if(nome.length<3)return falhar('Escreva o seu nome completo.');
  if(tel.length<10)return falhar('Informe o telefone com DDD.');
  if(!PAG)return falhar('Escolha como quer pagar.');
  if(TIPO==='entrega'&&el('fEndereco').value.trim().length<8)return falhar('Escreva o endereço completo.');

  b.disabled=true;b.textContent='Enviando…';
  try{
    const r=await fetch(URL_+'/functions/v1/criar-pedido',{method:'POST',headers:hdr,body:JSON.stringify({
      nome,telefone:tel,tipo:TIPO,
      endereco:TIPO==='entrega'?el('fEndereco').value.trim():null,
      referencia:TIPO==='entrega'?el('fRef').value.trim():null,
      observacao:el('fObs').value.trim(),
      pagamento:PAG,
      troco_para:PAG==='dinheiro'?num(el('fTroco').value):null,
      itens:Object.keys(CART).map(id=>({produto_id:id,qtd:CART[id]}))})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.erro||'Não consegui enviar o pedido.');
    if(d.pagamento_url){location.href=d.pagamento_url;return;}
    mostrarPronto(d);
  }catch(e){falhar(e.message);}
  finally{b.disabled=false;b.textContent='Enviar pedido';}};

function falhar(m){
  const err=el('erro');err.textContent=m;err.classList.remove('hide');
  err.scrollIntoView({behavior:'smooth',block:'center'});
  el('btnEnviar').disabled=false;el('btnEnviar').textContent='Enviar pedido';}

let PIXCODE='';
function mostrarPronto(d){
  el('passoDados').classList.add('hide');
  el('passoPronto').classList.remove('hide');
  el('okNum').textContent='#'+d.numero;
  el('okTxt').textContent=PAG==='pix_antecipado'
    ?'Assim que confirmarmos o Pix, começamos a preparar.'
    :'Já estamos preparando. '+(TIPO==='entrega'?'Você recebe em casa.':'É só vir buscar.')+
      (LOJA.tempo_preparo?' Cerca de '+num(LOJA.tempo_preparo)+' minutos.':'');

  if(PAG==='pix_antecipado'&&LOJA.pix_chave){
    PIXCODE=pixBRCode(LOJA.pix_chave,d.total,LOJA.pix_nome||'DOG DO RUBAO',LOJA.pix_cidade||'BRASILIA','DR'+d.numero);
    el('pixCode').textContent=PIXCODE;
    el('okPix').classList.remove('hide');}

  const msg='Olá! Fiz o pedido #'+d.numero+' no site, no valor de '+RS(d.total)+'.';
  el('okWhats').href='https://wa.me/'+(LOJA.whatsapp||'')+'?text='+encodeURIComponent(msg);
  window.scrollTo(0,0);}

window.copiarPix=()=>{
  navigator.clipboard.writeText(PIXCODE).then(()=>alert('Código copiado. Cole no app do seu banco.'),
    ()=>prompt('Copie o código:',PIXCODE));};

/* ---------------------------------------------- Pix copia e cola (BR Code) */
function pixBRCode(chave,valor,nome,cidade,txid){
  const tira=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 .-]/g,'').toUpperCase();
  const c=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const gui=c('00','BR.GOV.BCB.PIX')+c('01',String(chave).trim());
  let p=c('00','01')+c('26',gui)+c('52','0000')+c('53','986')+
        c('54',Number(valor).toFixed(2))+c('58','BR')+
        c('59',tira(nome).slice(0,25))+c('60',tira(cidade).slice(0,15))+
        c('62',c('05',tira(txid).slice(0,25)||'***'))+'6304';
  return p+crc16(p);}

function crc16(str){
  let crc=0xFFFF;
  for(let i=0;i<str.length;i++){
    crc^=str.charCodeAt(i)<<8;
    for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;}
  return crc.toString(16).toUpperCase().padStart(4,'0');}

iniciar();
</script>
</body>
</html>
